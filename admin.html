<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CGW — Admin Panel</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;display:flex;}

/* ── Login ── */
#login-screen{position:fixed;inset:0;z-index:9999;background:#0d1117;display:flex;align-items:center;justify-content:center;}
.login-card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:48px 40px;width:100%;max-width:400px;}
.login-logo{text-align:center;margin-bottom:28px;}
.login-logo img{height:56px;filter:brightness(0) invert(1);}
.login-title{font-size:22px;font-weight:700;text-align:center;margin-bottom:6px;letter-spacing:-0.02em;}
.login-sub{font-size:13px;color:#8b949e;text-align:center;margin-bottom:28px;}
.lf{margin-bottom:14px;}
.lf label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8b949e;margin-bottom:5px;}
.lf input{width:100%;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#e6edf3;font-size:14px;padding:10px 14px;outline:none;transition:border-color .2s;font-family:Arial,sans-serif;}
.lf input:focus{border-color:#58a6ff;}
.login-btn{width:100%;padding:11px;background:#1f6feb;border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;letter-spacing:.04em;transition:background .2s;font-family:Arial,sans-serif;}
.login-btn:hover{background:#388bfd;}
.login-err{font-size:12px;color:#f85149;text-align:center;margin-top:10px;min-height:16px;}

/* ── Sidebar ── */
.sidebar{width:230px;background:#161b22;border-right:1px solid #21262d;display:flex;flex-direction:column;height:100vh;position:fixed;left:0;top:0;}
.sb-logo{padding:20px 16px 18px;border-bottom:1px solid #21262d;display:flex;align-items:center;gap:10px;}
.sb-logo img{height:32px;filter:brightness(0) invert(1);}
.sb-logo span{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8b949e;}
.sb-nav{flex:1;padding:14px 8px;overflow-y:auto;}
.sb-section{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8b949e;padding:8px 12px 5px;}
.ni{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:#8b949e;transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:Arial,sans-serif;}
.ni:hover{background:rgba(255,255,255,.05);color:#e6edf3;}
.ni.active{background:rgba(31,111,235,.15);color:#58a6ff;}
.ni svg{flex-shrink:0;}
.nb{margin-left:auto;background:#1f6feb;color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;min-width:20px;text-align:center;}
.nb.orange{background:#e3a008;}
.sb-bottom{padding:12px 8px;border-top:1px solid #21262d;}

/* ── Main ── */
.main{margin-left:230px;flex:1;display:flex;flex-direction:column;min-height:100vh;}
.topbar{padding:14px 24px;border-bottom:1px solid #21262d;display:flex;align-items:center;gap:16px;background:#0d1117;flex-shrink:0;}
.topbar-title{font-size:17px;font-weight:700;letter-spacing:-.01em;}
.topbar-sub{font-size:12px;color:#8b949e;margin-top:1px;}
.topbar-actions{margin-left:auto;display:flex;gap:8px;}
.btn{padding:6px 13px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid #30363d;background:transparent;color:#e6edf3;transition:all .15s;font-family:Arial,sans-serif;text-decoration:none;display:inline-flex;align-items:center;gap:5px;}
.btn:hover{background:rgba(255,255,255,.06);}
.btn-primary{background:#1f6feb;border-color:#1f6feb;color:#fff;}
.btn-primary:hover{background:#388bfd;border-color:#388bfd;}
.btn-danger{border-color:#f85149;color:#f85149;}
.btn-danger:hover{background:rgba(248,81,73,.1);}

/* ── Inbox ── */
.inbox-layout{display:flex;flex:1;min-height:0;overflow:hidden;}
.msg-list{width:300px;border-right:1px solid #21262d;overflow-y:auto;background:#0d1117;flex-shrink:0;}
.mlh{padding:12px 16px;border-bottom:1px solid #21262d;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8b949e;display:flex;align-items:center;justify-content:space-between;}
.mi{padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:background .15s;position:relative;}
.mi:hover{background:rgba(255,255,255,.03);}
.mi.active{background:rgba(31,111,235,.1);border-left:2px solid #1f6feb;}
.mi.unread{padding-left:20px;}
.mi.unread .mi-sender{font-weight:700;color:#e6edf3;}
.mi-dot{position:absolute;top:17px;left:7px;width:5px;height:5px;border-radius:50%;background:#1f6feb;}
.mi-sender{font-size:13px;color:#c9d1d9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mi-preview{font-size:11px;color:#8b949e;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mi-meta{display:flex;align-items:center;justify-content:space-between;margin-top:4px;}
.mi-time{font-size:10px;color:#8b949e;}
.mi-tag{font-size:10px;padding:1px 6px;border-radius:4px;background:rgba(31,111,235,.2);color:#58a6ff;font-weight:600;}
.mi-tag.chat{background:rgba(63,185,80,.2);color:#3fb950;}

/* ── Detail ── */
.msg-detail{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#0d1117;}
.detail-empty{flex:1;display:flex;align-items:center;justify-content:center;color:#8b949e;font-size:14px;flex-direction:column;gap:10px;opacity:.5;}
.dh{padding:18px 24px 14px;border-bottom:1px solid #21262d;flex-shrink:0;}
.dh-name{font-size:18px;font-weight:700;letter-spacing:-.01em;}
.dh-email{font-size:13px;color:#58a6ff;margin-top:3px;}
.dh-meta{font-size:11px;color:#8b949e;margin-top:4px;}
.dh-actions{display:flex;gap:6px;flex-shrink:0;}
.db{flex:1;overflow-y:auto;padding:20px 24px;}
.bubble{background:#161b22;border:1px solid #21262d;border-radius:12px;padding:14px 16px;margin-bottom:14px;}
.bubble-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8b949e;margin-bottom:7px;}
.bubble-text{font-size:13px;line-height:1.7;color:#e6edf3;white-space:pre-wrap;}
.bubble.reply{background:rgba(31,111,235,.07);border-color:rgba(31,111,235,.25);}
.bubble.reply .bubble-label{color:#58a6ff;}
.budget-tag{display:inline-block;padding:3px 10px;background:rgba(63,185,80,.15);color:#3fb950;border-radius:6px;font-size:11px;font-weight:700;margin-bottom:14px;}

/* ── Reply compose ── */
.rc{border-top:1px solid #21262d;padding:14px 24px;background:#161b22;flex-shrink:0;}
.rc-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8b949e;margin-bottom:8px;}
.rc-ta{width:100%;background:#0d1117;border:1px solid #30363d;border-radius:9px;color:#e6edf3;font-family:Arial,sans-serif;font-size:13px;line-height:1.6;padding:10px 13px;resize:vertical;min-height:80px;outline:none;transition:border-color .2s;}
.rc-ta:focus{border-color:#58a6ff;}
.rc-actions{display:flex;gap:8px;margin-top:8px;}

/* ── Applications ── */
.app-card{background:#161b22;border:1px solid #21262d;border-radius:12px;padding:18px 20px;margin-bottom:14px;}
.app-card.unread{border-left:3px solid #1f6feb;}

/* ── Empty ── */
.empty-state{text-align:center;padding:50px 20px;color:#8b949e;}
.empty-state p{font-size:13px;margin-top:8px;}

/* ── Toast ── */
#toast{position:fixed;bottom:24px;right:24px;background:#1f6feb;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;}
#toast.show{opacity:1;transform:translateY(0);}
#toast.err{background:#f85149;}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:2px;}

.section{display:none;}
.section.active{display:flex;flex-direction:column;flex:1;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo"><img src="images/cgw-logo.svg" alt="CGW"/></div>
    <div class="login-title">Admin Panel</div>
    <div class="login-sub">Sign in to manage messages &amp; enquiries</div>
    <div class="lf">
      <label>Username</label>
      <input type="text" id="lu" placeholder="admin"/>
    </div>
    <div class="lf">
      <label>Password</label>
      <input type="password" id="lp" placeholder="Enter password"/>
    </div>
    <button class="login-btn" id="login-btn">Sign In</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sb-logo">
    <img src="images/cgw-logo.svg" alt="CGW"/>
    <span>Admin</span>
  </div>
  <nav class="sb-nav">
    <div class="sb-section">Messages</div>
    <button class="ni active" data-sec="inbox">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      Inbox
      <span class="nb" id="inbox-nb" style="display:none"></span>
    </button>
    <div class="sb-section" style="margin-top:8px;">Careers</div>
    <button class="ni" data-sec="applications">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Applications
      <span class="nb orange" id="apps-nb" style="display:none"></span>
    </button>
  </nav>
  <div class="sb-bottom">
    <button class="ni" id="logout-btn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sign Out
    </button>
  </div>
</aside>

<!-- MAIN -->
<main class="main">

  <!-- INBOX -->
  <div id="sec-inbox" class="section active">
    <div class="topbar">
      <div>
        <div class="topbar-title">Inbox</div>
        <div class="topbar-sub" id="inbox-sub">Loading…</div>
      </div>
      <div class="topbar-actions">
        <button class="btn" id="inbox-refresh">↻ Refresh</button>
      </div>
    </div>
    <div class="inbox-layout">
      <div class="msg-list">
        <div class="mlh"><span>All Messages</span><span id="ml-count"></span></div>
        <div id="ml-items"></div>
      </div>
      <div class="msg-detail" id="msg-detail">
        <div class="detail-empty">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <p>Select a message to read it</p>
        </div>
      </div>
    </div>
  </div>

  <!-- APPLICATIONS -->
  <div id="sec-applications" class="section">
    <div class="topbar">
      <div>
        <div class="topbar-title">Job Applications</div>
        <div class="topbar-sub" id="apps-sub">Loading…</div>
      </div>
      <div class="topbar-actions">
        <button class="btn" id="apps-refresh">↻ Refresh</button>
      </div>
    </div>
    <div style="flex:1;overflow-y:auto;padding:24px;">
      <div id="apps-list"></div>
    </div>
  </div>

</main>

<div id="toast"></div>

<script>
(function(){
  const PASS = 'REDACTED-OLD-SECRET';
  const TK   = 'cgw_admin_auth';

  /* ── Auth ── */
  function loggedIn(){ return localStorage.getItem(TK) === PASS; }
  if (loggedIn()) boot();

  document.getElementById('lp').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('login-btn').click(); });
  document.getElementById('lu').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('lp').focus(); });

  document.getElementById('login-btn').addEventListener('click', () => {
    const u = document.getElementById('lu').value.trim();
    const p = document.getElementById('lp').value;
    if (u === 'admin' && p === PASS) {
      localStorage.setItem(TK, PASS);
      boot();
    } else {
      document.getElementById('login-err').textContent = 'Incorrect username or password.';
      document.getElementById('lp').value = '';
      document.getElementById('lp').focus();
    }
  });

  document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.removeItem(TK);
    location.reload();
  });

  /* ── Helpers ── */
  function ah(extra){ return Object.assign({'Content-Type':'application/json','X-Admin-Token':PASS}, extra||{}); }

  function toast(msg, err){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'show' + (err ? ' err' : '');
    clearTimeout(el._t);
    el._t = setTimeout(()=>el.className='', 3000);
  }

  function timeAgo(iso){
    const d = Date.now() - new Date(iso).getTime();
    const m = Math.floor(d/60000);
    if(m<1) return 'just now';
    if(m<60) return m+'m ago';
    const h = Math.floor(m/60);
    if(h<24) return h+'h ago';
    return Math.floor(h/24)+'d ago';
  }

  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  /* ── Nav ── */
  document.querySelectorAll('.ni[data-sec]').forEach(btn => {
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.ni').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const sec = btn.dataset.sec;
      document.querySelectorAll('.section').forEach(s=>{ s.style.display='none'; s.classList.remove('active'); });
      const el = document.getElementById('sec-'+sec);
      if(el){ el.style.display='flex'; el.classList.add('active'); }
      if(sec==='inbox') loadMessages();
      if(sec==='applications') loadApps();
    });
  });

  /* ── Messages ── */
  let msgs = [], selId = null;

  async function loadMessages(){
    let contact = [], chat = [];
    try{
      const r = await fetch('/api/messages', {headers:ah()});
      if(r.ok) contact = await r.json();
    }catch(_){}
    try{
      const r2 = await fetch('/api/leads', {headers:ah()});
      if(r2.ok){
        const leads = await r2.json();
        chat = leads
          .filter(l => l.type === 'chat-email')
          .map(l => ({
            id: l.id, name: l.data?.name||'Anonymous', email: l.data?.email||'',
            message: l.data?.message||'', budget: l.data?.subject||'',
            source:'chat', sentAt: l.createdAt, read:false, replies:[]
          }));
      }
    }catch(_){}
    msgs = [...contact, ...chat].sort((a,b)=>new Date(b.sentAt)-new Date(a.sentAt));
    renderList();
    const unread = msgs.filter(m=>!m.read).length;
    const nb = document.getElementById('inbox-nb');
    if(unread>0){ nb.textContent=unread; nb.style.display=''; } else nb.style.display='none';
    document.getElementById('inbox-sub').textContent = msgs.length + ' message' + (msgs.length!==1?'s':'');
    document.getElementById('ml-count').textContent = msgs.length;
  }

  function renderList(){
    const c = document.getElementById('ml-items');
    if(!msgs.length){
      c.innerHTML='<div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg><p>No messages yet</p></div>';
      return;
    }
    c.innerHTML = msgs.map(m=>`
      <div class="mi ${!m.read?'unread':''} ${m.id===selId?'active':''}" data-id="${esc(m.id)}">
        ${!m.read?'<div class="mi-dot"></div>':''}
        <div class="mi-sender">${esc(m.name)}</div>
        <div class="mi-preview">${esc((m.message||'').slice(0,55))}${(m.message||'').length>55?'…':''}</div>
        <div class="mi-meta">
          <span class="mi-time">${timeAgo(m.sentAt)}</span>
          <span class="mi-tag ${m.source==='chat'?'chat':''}">${m.source==='chat'?'Chat':'Contact'}</span>
        </div>
      </div>
    `).join('');
    c.querySelectorAll('.mi').forEach(el=>el.addEventListener('click',()=>selectMsg(el.dataset.id)));
  }

  async function selectMsg(id){
    selId = id;
    const m = msgs.find(x=>x.id===id);
    if(!m) return;
    if(!m.read){
      m.read = true;
      if(m.source!=='chat'){
        try{ await fetch('/api/messages/'+id+'/read',{method:'PATCH',headers:ah()}); }catch(_){}
      }
      renderList();
    }
    const dt = document.getElementById('msg-detail');
    dt.innerHTML = `
      <div class="dh">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;">
          <div>
            <div class="dh-name">${esc(m.name)}</div>
            <div class="dh-email">${esc(m.email)}</div>
            <div class="dh-meta">
              ${m.budget?`Budget: <strong>${esc(m.budget)}</strong> &nbsp;·&nbsp; `:''}
              ${new Date(m.sentAt).toLocaleString()}
            </div>
          </div>
          <div class="dh-actions">
            <a href="mailto:${esc(m.email)}?subject=Re:%20Your%20enquiry%20to%20CGW&body=${encodeURIComponent('Hi '+m.name+',\n\n')}"
               class="btn btn-primary" target="_blank">Reply via Gmail</a>
            <button class="btn btn-danger" id="del-btn">Delete</button>
          </div>
        </div>
      </div>
      <div class="db" id="db">
        ${m.budget?`<div class="budget-tag">Budget: ${esc(m.budget)}</div>`:''}
        <div class="bubble">
          <div class="bubble-label">Message from ${esc(m.name)}</div>
          <div class="bubble-text">${esc(m.message)}</div>
        </div>
        ${(m.replies||[]).map(r=>`
          <div class="bubble reply">
            <div class="bubble-label">Your reply · ${new Date(r.sentAt).toLocaleString()}</div>
            <div class="bubble-text">${esc(r.text)}</div>
          </div>
        `).join('')}
      </div>
      <div class="rc">
        <div class="rc-label">Write a reply note</div>
        <textarea class="rc-ta" id="rc-input" placeholder="Type your reply here…"></textarea>
        <div class="rc-actions">
          <button class="btn btn-primary" id="save-reply">Save Reply</button>
          <a href="mailto:${esc(m.email)}?subject=Re:%20Your%20enquiry%20to%20CGW"
             class="btn" target="_blank">Open in Gmail ↗</a>
        </div>
      </div>
    `;

    document.getElementById('del-btn').addEventListener('click', async ()=>{
      if(!confirm('Delete this message?')) return;
      if(m.source!=='chat'){
        try{ await fetch('/api/messages/'+id,{method:'DELETE',headers:ah()}); }catch(_){}
      }
      msgs = msgs.filter(x=>x.id!==id);
      selId = null;
      renderList();
      dt.innerHTML = '<div class="detail-empty"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg><p>Select a message to read it</p></div>';
      toast('Message deleted');
    });

    document.getElementById('save-reply').addEventListener('click', async ()=>{
      const text = document.getElementById('rc-input').value.trim();
      if(!text) return;
      const reply = {text, sentAt: new Date().toISOString()};
      if(!m.replies) m.replies=[];
      m.replies.push(reply);
      if(m.source!=='chat'){
        try{ await fetch('/api/messages/'+id+'/reply',{method:'POST',headers:ah(),body:JSON.stringify({text})}); }catch(_){}
      }
      document.getElementById('rc-input').value='';
      const db = document.getElementById('db');
      const div = document.createElement('div');
      div.className = 'bubble reply';
      div.innerHTML = `<div class="bubble-label">Your reply · just now</div><div class="bubble-text">${esc(text)}</div>`;
      db.appendChild(div);
      db.scrollTop = db.scrollHeight;
      toast('Reply saved');
    });
  }

  document.getElementById('inbox-refresh').addEventListener('click', loadMessages);

  /* ── Applications ── */
  async function loadApps(){
    let apps = [];
    try{
      const r = await fetch('/api/applications',{headers:ah()});
      if(r.ok) apps = await r.json();
    }catch(_){}
    const unread = apps.filter(a=>!a.read).length;
    const nb = document.getElementById('apps-nb');
    if(unread>0){ nb.textContent=unread; nb.style.display=''; } else nb.style.display='none';
    document.getElementById('apps-sub').textContent = apps.length + ' application'+(apps.length!==1?'s':'');
    const c = document.getElementById('apps-list');
    if(!apps.length){ c.innerHTML='<div class="empty-state"><p>No job applications yet</p></div>'; return; }
    c.innerHTML = apps.map(a=>`
      <div class="app-card ${!a.read?'unread':''}">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px;">
          <div>
            <div style="font-size:15px;font-weight:700;">${esc(a.name)}</div>
            <div style="font-size:13px;color:#58a6ff;margin-top:2px;">${esc(a.email)}</div>
            ${a.phone?`<div style="font-size:12px;color:#8b949e;margin-top:2px;">${esc(a.phone)}</div>`:''}
          </div>
          <div style="display:flex;gap:6px;flex-shrink:0;">
            <a href="mailto:${esc(a.email)}?subject=Re:%20Your%20application%20to%20CGW" class="btn btn-primary" target="_blank" style="font-size:12px;padding:5px 10px;">Reply</a>
            <button class="btn btn-danger" style="font-size:12px;padding:5px 10px;" onclick="delApp('${esc(a.id)}',this)">Delete</button>
          </div>
        </div>
        <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;">
          <span style="background:rgba(63,185,80,.15);color:#3fb950;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;">${esc(a.position)}</span>
          <span style="background:rgba(31,111,235,.15);color:#58a6ff;font-size:11px;padding:2px 8px;border-radius:4px;">${new Date(a.appliedAt).toLocaleDateString()}</span>
        </div>
        ${a.message?`<div style="font-size:13px;line-height:1.65;color:#8b949e;white-space:pre-wrap;">${esc(a.message)}</div>`:''}
        ${a.portfolio?`<div style="margin-top:8px;"><a href="${esc(a.portfolio)}" target="_blank" style="font-size:12px;color:#58a6ff;">Portfolio →</a></div>`:''}
      </div>
    `).join('');
  }

  window.delApp = async function(id, btn){
    if(!confirm('Delete this application?')) return;
    try{ await fetch('/api/applications/'+id,{method:'DELETE',headers:ah()}); }catch(_){}
    btn.closest('.app-card').remove();
    toast('Application deleted');
  };

  document.getElementById('apps-refresh').addEventListener('click', loadApps);

  /* ── Boot ── */
  function boot(){
    document.getElementById('login-screen').style.display='none';
    loadMessages();
    loadApps();
  }
})();
</script>
</body>
</html>
